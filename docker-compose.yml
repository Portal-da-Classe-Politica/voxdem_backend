services:
  postgres:
    image: postgres:15-alpine
    container_name: survey_postgres
    environment:
      POSTGRES_DB: voxdem_survey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-database.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sqlinserts:/docker-entrypoint-initdb.d/sqlinserts:ro
      - ./database:/docker-entrypoint-initdb.d/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voxdem_survey"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: 
      context: .
      target: production
    container_name: survey_app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: voxdem_survey
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

volumes:
  postgres_data:
