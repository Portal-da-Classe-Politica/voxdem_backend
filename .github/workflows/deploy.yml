name: Deploy VoxDem to UFPR Server

# Trigger deployment only on push to main branch
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout do Código
        uses: actions/checkout@v3

      - name: 🔑 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🐳 Build Docker Image
        run: |
          # Build da aplicação VoxDem
          docker build -t voxdem-app:latest .
          
          # Salvar imagem como arquivo tar
          docker save voxdem-app:latest > voxdem-app.tar

      - name: 📦 Transfer files to server
        run: |
          # Criar diretório no servidor se não existir
          ssh root@${{ secrets.SSH_HOST }} "mkdir -p /opt/voxdem"
          
          # Verificar quais arquivos existem
          ls -la
          
          # Transferir arquivos necessários
          scp voxdem-app.tar root@${{ secrets.SSH_HOST }}:/opt/voxdem/
          scp docker-compose.prod.yml root@${{ secrets.SSH_HOST }}:/opt/voxdem/
          scp init-database.sql root@${{ secrets.SSH_HOST }}:/opt/voxdem/
          
          # Transferir diretórios se existirem
          if [ -d "sqlinserts" ]; then
            scp -r sqlinserts root@${{ secrets.SSH_HOST }}:/opt/voxdem/
          fi
          
          if [ -d "database" ]; then
            scp -r database root@${{ secrets.SSH_HOST }}:/opt/voxdem/
          fi

      - name: 🚀 Deploy VoxDem no servidor
        run: |
          ssh root@${{ secrets.SSH_HOST }} << 'EOF'
            cd /opt/voxdem
            
            # Parar containers existentes se estiverem rodando
            docker compose -f docker-compose.prod.yml down --volumes 2>/dev/null || true
            
            # Remover imagem antiga
            docker rmi voxdem-app:latest 2>/dev/null || true
            
            # Carregar nova imagem
            docker load < voxdem-app.tar
            
            # Criar .env se não existir
            if [ ! -f .env ]; then
              echo "POSTGRES_DB=voxdem_survey" > .env
              echo "POSTGRES_USER=postgres" >> .env
              echo "POSTGRES_PASSWORD=voxdem_secure_2024" >> .env
              echo "POSTGRES_HOST=db" >> .env
              echo "POSTGRES_PORT=5432" >> .env
              echo "APP_PORT=3000" >> .env
              echo "NODE_ENV=production" >> .env
              echo "✅ Arquivo .env criado"
            fi
            
            # Iniciar serviços
            docker compose -f docker-compose.prod.yml up -d
            
            # Aguardar PostgreSQL ficar pronto
            echo "⏳ Aguardando PostgreSQL..."
            sleep 30
            
            # Verificar se containers estão rodando
            echo "📊 Status dos containers:"
            docker compose -f docker-compose.prod.yml ps
            
            # Limpar arquivo temporário
            rm -f voxdem-app.tar
            
            echo "✅ Deploy do VoxDem concluído!"
            echo "📍 VoxDem API disponível em: http://$(hostname -I | awk '{print $1}'):3008"
            echo "🩺 Health check: curl http://$(hostname -I | awk '{print $1}'):3008/api/health"
          EOF

      - name: 🔍 Health Check
        run: |
          ssh root@${{ secrets.SSH_HOST }} << 'EOF'
            # Faz polling em vez de um único curl após sleep fixo: no primeiro
            # deploy (ou sempre que o volume do Postgres for recriado), o
            # carregamento dos sqlinserts pode levar bem mais que 20-30s.
            echo "⏳ Aguardando VoxDem API responder (até 3 minutos)..."
            success=false
            for i in $(seq 1 36); do
              if curl -f http://localhost:3008/api/health 2>/dev/null; then
                echo "✅ VoxDem API está funcionando!"
                success=true
                break
              fi
              sleep 5
            done

            if [ "$success" != "true" ]; then
              echo "❌ VoxDem API não está respondendo"
              echo "📋 Logs da aplicação:"
              docker compose -f /opt/voxdem/docker-compose.prod.yml logs --tail=50 app
              echo "📋 Logs do banco:"
              docker compose -f /opt/voxdem/docker-compose.prod.yml logs --tail=50 db
              exit 1
            fi
          EOF

      - name: 🧹 Cleanup
        run: |
          # Limpar arquivos locais
          docker rmi voxdem-app:latest || true
          rm -f voxdem-app.tar
